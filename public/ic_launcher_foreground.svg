    <!-- Passive Grid Slots -->
    <rect x="0" y="0" width="32" height="32" rx="10" fill="#1e1e1e" />
    <rect x="40" y="0" width="32" height="32" rx="10" fill="#1e1e1e" />
    <rect x="0" y="40" width="32" height="32" rx="10" fill="#1e1e1e" />
    <rect x="40" y="40" width="32" height="32" rx="10" fill="#1e1e1e" />

    <!-- Active Block (Pastel Green) -->
    <rect x="0" y="40" width="32" height="32" rx="10" fill="#DCEDC8" />
    
    <!-- Merging Blocks (Pastel Blue) - Stretching vertically to represent Fusion -->
    <path d="M40 10 C 40 4.477 44.477 0 50 0 L 62 0 C 67.523 0 72 4.477 72 10 L 72 62 C 72 67.523 67.523 72 62 72 L 50 72 C 44.477 72 40 67.523 40 62 L 40 10 Z" fill="#B2EBF2" />
    
